name: Env and Secrets Demo

on:
  workflow_dispatch:

# 1. WORKFLOW-LEVEL ENV: Available to all jobs and steps
env:
  APP_ENV: "production"
  DEPLOY_REGION: "eastus"

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    # 2. JOB-LEVEL ENV: Available to all steps in this job
    env:
      SERVER_USER: "ubuntu"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. STEP-LEVEL ENV + SECRETS: Best practice for passing secrets to shell scripts
      - name: Run script with env and secret
        env:
          MY_API_KEY: ${{ secrets.API_KEY }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Environment is: $APP_ENV"
          echo "Deploying to: $DEPLOY_REGION as $SERVER_USER"
          echo "Secret output will be masked: $MY_API_KEY"
