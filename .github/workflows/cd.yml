name: AWS EC2 Production CD

on:
  workflow_run:
    workflows: ["Node.js Production CI"] # Must match the 'name:' in ci.yml
    types:
      - completed
    branches: [main]
  workflow_dispatch: # Allows manual deployment anytime from GitHub Actions

jobs:
  build-push-and-deploy:
    name: Build Image & Deploy to AWS EC2
    # Only deploy if CI succeeded (or if triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and push Docker image to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-aws-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-aws-app:${{ github.sha }}

      # 4. SSH into AWS EC2, pull the new image, and restart the container
      - name: Deploy container to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,MONGO_URI,JWT_SECRET_KEY
          script: |
            set -e
            IMAGE="$DOCKERHUB_USERNAME/node-aws-app:latest"

            echo "Pulling latest image from Docker Hub..."
            docker pull "$IMAGE"

            echo "Stopping and removing existing container..."
            docker stop node-app || true
            docker rm node-app || true

            echo "Starting new container on port 5000..."
            docker run -d \
              --name node-app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e MONGO_URI="$MONGO_URI" \
              -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
              "$IMAGE"

            echo "Cleaning up unused images..."
            docker image prune -f
